# ── prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on
set -g status-position top 
set -g default-terminal 'tmux-256color'

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-window-option -g mode-keys vi
set-option -g renumber-windows on

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @catppuccin_window_status_style "rounded"

## Save/restore sessions (resurrect + continuum)
set -g @resurrect-capture-pane-contents 'on'  # remember what was on screen in each pane
set -g @continuum-restore 'on'                # auto-restore last session on tmux server start
set -g @continuum-save-interval '15'          # auto-save every 15 minutes

## Window global/default configuration
set -g @catppuccin_window_default_text " #{window_name}"
set -g @catppuccin_window_status "icon"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_status_modules_right "directory date_time"
set -g @catppuccin_directory_text "#{s|/Users||:pane_current_path}"


## Window current configuration
set -g @catppuccin_window_current_text " #{window_name}"
set -g @catppuccin_window_current_fill "all"



# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""

set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

run '~/.tmux/plugins/tpm/tpm'

# ── active pane HUD (Matrix vibe) ───────────────────────────────────────────────
# Set after tpm so it wins over any plugin theming.
set -g pane-border-lines heavy            # thickest line glyphs tmux offers
set -g pane-border-indicators both        # directional arrows + color on active edge
set -g pane-border-status top             # readout strip on the top border
# HUD label: neon-green ▓▒░ index · command ░▒▓ on the active pane, dim on the rest
set -g pane-border-format "#{?pane_active,#[fg=#00ff5f bold]▓▒░ #{pane_index} · #{pane_current_command} ░▒▓,#[fg=#585b70]#{pane_index} · #{pane_current_command}}"
set -g pane-active-border-style "fg=#00ff5f,bold"       # neon matrix green
set -g pane-border-style "fg=#585b70"                   # dim grey for inactive panes



